<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2646"/>
      <stop offset="55%" stop-color="#111729"/>
      <stop offset="100%" stop-color="#090D19"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#4E7CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4E7CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FB0FF"/>
      <stop offset="100%" stop-color="#3B63E0"/>
    </linearGradient>

    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Mark: feedback bubble fused with a pin point (feedback -> located on the roadmap) -->
  <g transform="translate(512,512)" filter="url(#softShadow)">
    <path d="
      M -126,-190
      L 126,-190
      A 64,64 0 0 1 190,-126
      L 190,26
      A 64,64 0 0 1 126,90
      L 50,90
      L 0,195
      L -50,90
      L -126,90
      A 64,64 0 0 1 -190,26
      L -190,-126
      A 64,64 0 0 1 -126,-190
      Z"
      fill="#FFFFFF"/>
  </g>

  <!-- Upvote arrow (the core action of the board) -->
  <g transform="translate(512,500)">
    <path d="M 0,-95 L 58,-22 L 20,-22 L 20,55 L -20,55 L -20,-22 L -58,-22 Z"
          fill="url(#accent)"/>
  </g>
</svg>
